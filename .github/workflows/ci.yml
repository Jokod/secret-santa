name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_SECRET: test_secret_not_for_production
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/santa_test?serverVersion=8.0&charset=utf8mb4
      DEFAULT_URI: http://localhost
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: in-memory://
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: pdo_mysql, intl, apcu

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint YAML
        run: php bin/console lint:yaml config translations --parse-tags

      - name: Lint Twig
        run: php bin/console lint:twig templates

      - name: Lint container
        run: php bin/console lint:container

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: santa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      APP_SECRET: test_secret_not_for_production
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/santa_test?serverVersion=8.0&charset=utf8mb4
      DEFAULT_URI: http://localhost
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: in-memory://
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: pdo_mysql, intl, apcu

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare database
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run PHPUnit
        run: vendor/bin/phpunit
