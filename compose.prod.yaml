# Production — docker compose -f compose.prod.yaml --env-file .env.local up -d
# Image : ghcr.io/jokod/secret-santa

x-app-environment: &app-environment
  APP_ENV: prod
  APP_DEBUG: "0"
  APP_SECRET: ${APP_SECRET:?APP_SECRET required}
  DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}@database:3306/${MYSQL_DATABASE:-santa}?serverVersion=8.0&charset=utf8mb4
  DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI required}
  MAILER_DSN: ${MAILER_DSN:-null://null}
  MAIL_FROM: ${MAIL_FROM:-noreply@santa.local}
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
  MERCURE_URL: http://mercure/.well-known/mercure
  MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET required}
  MERCURE_JWT_ISSUER: ${MERCURE_JWT_ISSUER:-${DEFAULT_URI}}

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/jokod/secret-santa}:${APP_IMAGE_TAG:-latest}
    container_name: santa_app_${APP_INSTANCE:-prod}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      <<: *app-environment
      SERVER_NAME: ":80"
      CADDY_GLOBAL_OPTIONS: |
        servers {
          trusted_proxies static private_ranges
        }
      # Same-origin SSE : proxy hub Mercure
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        handle /.well-known/mercure* {
          reverse_proxy mercure:80
        }
    volumes:
      - app_var_log:/app/var/log:rw
    depends_on:
      database:
        condition: service_healthy
      mercure:
        condition: service_started

  worker:
    image: ${APP_IMAGE:-ghcr.io/jokod/secret-santa}:${APP_IMAGE_TAG:-latest}
    container_name: santa_worker_${APP_INSTANCE:-prod}
    restart: unless-stopped
    environment:
      <<: *app-environment
    command:
      - sh
      - -c
      - |
        while true; do
          php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -vv || true
          sleep 1
        done
    volumes:
      - app_var_log:/app/var/log:rw
    depends_on:
      database:
        condition: service_healthy
      app:
        condition: service_started
      mercure:
        condition: service_started

  mercure:
    image: dunglas/mercure
    container_name: santa_mercure_${APP_INSTANCE:-prod}
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET required}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET required}
      MERCURE_TRUSTED_ISSUERS: ${MERCURE_JWT_ISSUER:-${DEFAULT_URI}}
      # JWT only — no anonymous, no playground
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${DEFAULT_URI}
    volumes:
      - mercure_data:/data
      - mercure_config:/config

  database:
    image: mysql:8.0
    container_name: santa_database_${APP_INSTANCE:-prod}
    restart: always
    ports:
      - "${MYSQL_PORT:-6950}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-santa}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  app_var_log:
  mercure_data:
  mercure_config:
