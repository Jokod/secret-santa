framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
            # Pas de minify natif : on précompresse pour gzip/brotli au déploiement.
            precompress:
                extensions: ['.css', '.js', '.svg', '.woff', '.woff2']

