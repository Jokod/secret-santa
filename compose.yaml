services:

  database:
    image: mysql:8.0
    container_name: santa_database_${APP_INSTANCE}
    restart: always
    ports:
      - 6950:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: santa_phpmyadmin_${APP_INSTANCE}
    ports:
      - 6951:80
    depends_on:
      database:
        condition: service_healthy
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PHP_INI_UPLOAD_MAX_FILESIZE: 100M
      PHP_INI_POST_MAX_SIZE: 100M
      UPLOAD_LIMIT: 2048M
    restart: always

  mailer:
    image: mailhog/mailhog
    container_name: santa_mailer_${APP_INSTANCE}
    ports:
      - 6952:1025 # smtp server
      - 6953:8025 # web ui

  mercure:
    image: dunglas/mercure
    container_name: santa_mercure_${APP_INSTANCE}
    restart: unless-stopped
    ports:
      - "6954:80"
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_TRUSTED_ISSUERS: ${MERCURE_JWT_ISSUER:-https://localhost}
      # No anonymous / no playground — JWT required
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins https://santa.wip http://127.0.0.1:8000 http://localhost:8000
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  mysql_data:
  mercure_data:
  mercure_config:
